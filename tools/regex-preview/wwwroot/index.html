<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Find common regular expressions and test them with C# or JavaScript in CodeFolio.">
  <meta name="color-scheme" content="dark">
  <title>Regex reference · CodeFolio by Sun</title>
  <link rel="icon" href="../branding/assets/icons/icon-32.png">
  <link rel="stylesheet" href="../app/styles.css?v=regex-reference-1">
  <link rel="stylesheet" href="./preview.css?v=regex-reference-1">
  <script type="module" src="./preview.mjs?v=regex-reference-1"></script>
</head>
<body>
  <header class="site-header">
    <div class="container brand">
      <img src="../branding/assets/icons/icon-64.png" width="38" height="38" alt="">
      <span>CODEFOLIO <small>by Sun</small></span>
    </div>
    <nav class="container site-nav" aria-label="CodeFolio">
      <a href="../">Snippets</a>
      <a href="./" aria-current="page">Regex</a>
    </nav>
  </header>
  <main class="container regex-reference">
    <section class="intro" aria-labelledby="page-title">
      <h1 id="page-title">Regex reference</h1>
      <p>Find common patterns and test them against your own text.</p>
      <div class="regex-search">
        <div><label for="pattern-search">Search patterns</label><input id="pattern-search" type="search" autocomplete="off"></div>
        <div>
          <label for="platform">Platform</label>
          <select id="platform"><option value="csharp">C# / .NET 10</option><option value="javascript">JavaScript</option></select>
        </div>
      </div>
      <details class="search-filters">
        <summary>Filters</summary>
        <details class="tag-filter">
          <summary>Tags</summary>
          <div id="tag-options" class="tag-filter-options"></div>
          <p id="no-tags" class="muted">No tags added yet.</p>
        </details>
        <div class="filter-options"><label><input id="favorites-only" type="checkbox"> Favorites</label></div>
      </details>
      <ul id="active-filters" class="active-filters" aria-label="Active filters" hidden></ul>
    </section>
    <div class="layout">
      <section class="browse" aria-labelledby="pattern-list-title">
        <h2 id="pattern-list-title" tabindex="-1">Patterns</h2>
        <p id="pattern-count" class="muted" role="status">Loading patterns…</p>
        <ul id="patterns" class="results"></ul>
        <section id="backup-tools" aria-label="Regex backups">
          <div class="variant-transfer">
            <button id="export-backup" type="button">Export</button>
            <button id="import-backup" type="button">Import</button>
            <button id="share-backup" type="button">Share</button>
            <input id="backup-file" type="file" accept=".json,application/json" hidden>
          </div>
          <p id="backup-status" class="muted" role="status"></p>
        </section>
      </section>
      <article id="detail" class="panel" aria-labelledby="pattern-title" hidden>
        <button id="back-to-results" type="button">Back to results</button>
        <p id="pattern-platform" class="language"></p>
        <h2 id="pattern-title" tabindex="-1"></h2>
        <div class="snippet-actions">
          <button id="favorite" type="button" aria-pressed="false">Favorite</button>
          <button id="copy-pattern" type="button">Copy pattern</button>
          <button id="copy-link" type="button">Copy link</button>
        </div>
        <p id="detail-status" class="muted" role="status"></p>
        <div id="copy-fallback" hidden>
          <label for="copy-value">Copy this text</label>
          <input id="copy-value" readonly>
        </div>
        <p id="pattern-description" class="muted"></p>
        <pre><code id="pattern-source"></code></pre>
        <p id="pattern-mode" class="muted"></p>
        <section aria-labelledby="regex-tags-title">
          <div class="tag-heading">
            <h3 id="regex-tags-title">Tags</h3>
            <button id="toggle-tag-editor" type="button" aria-label="Add a tag" aria-expanded="false" aria-controls="tag-editor">+</button>
          </div>
          <ul id="pattern-tags" class="tag-list"></ul>
          <form id="tag-editor" class="tag-editor" hidden>
            <div><label for="tag-name">Tag name</label><input id="tag-name" maxlength="80" required></div>
            <button type="submit">Add tag</button>
          </form>
        </section>
        <form id="try-it">
          <h3>Try It</h3>
          <div class="regex-examples">
            <div><strong>Matches</strong> <code id="matching-example"></code></div>
            <div><strong>Doesn’t match</strong> <code id="nonmatching-example"></code></div>
          </div>
          <div class="snippet-actions">
            <button id="use-match" type="button">Use matching example</button>
            <button id="use-nonmatch" type="button">Use non-matching example</button>
          </div>
          <label for="test-input">Test text</label>
          <textarea id="test-input" rows="3" maxlength="10000" spellcheck="false"></textarea>
          <button id="test-button" type="submit">Test pattern</button>
          <p id="test-status" class="status" role="status"></p>
          <pre id="match-result" hidden></pre>
        </form>
      </article>
    </div>
  </main>
</body>
</html>
