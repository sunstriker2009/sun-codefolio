name: Regex preview
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/regex-preview.yml'
      - 'tools/regex-preview/**'
      - 'app/styles.css'
      - 'branding/assets/icons/icon-64.png'
permissions:
  contents: read
jobs:
  build-regex-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install .NET WebAssembly tools
        run: dotnet workload install wasm-tools --skip-manifest-update
      - name: Build Regex preview
        run: bash tools/regex-preview/build-preview.sh "$RUNNER_TEMP/codefolio-regex-preview"
      - uses: actions/upload-artifact@v4
        with:
          name: codefolio-regex-preview
          path: ${{ runner.temp }}/codefolio-regex-preview/
          if-no-files-found: error
